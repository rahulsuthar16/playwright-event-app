name: Playwright Tests & Publish

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      test_tag:
        description: 'Test tag to run (e.g., @smoke, @regression). Leave blank to run all tests.'
        required: false
        default: ''
        type: string

jobs:
  # --- STAGE 1: Run Tests & Upload Report ---
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Cache Playwright browser binaries to skip unnecessary downloads
    - name: Get Playwright version
      id: playwright-version
      run: echo "VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_ENV

    - name: Cache Playwright Browsers
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ env.VERSION }}

    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: |
        TAG="${{ github.event.inputs.test_tag }}"
        if [ -n "$TAG" ]; then
          echo "Running tests with tag/grep: $TAG"
          npx playwright test --grep "$TAG"
        else
          echo "No tag provided. Running all tests."
          npx playwright test
        fi
      env:
        CI: true

    - name: Upload HTML Report Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-html-report
        path: playwright-report/
        retention-days: 30

  # --- STAGE 2: Publish Report to GitHub Pages (No 404) ---
  publish-report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download HTML Report Artifact
      uses: actions/download-artifact@v4
      with:
        name: playwright-html-report
        path: playwright-report/

    - name: Deploy Report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./playwright-report
        # Removing destination_dir places index.html at the root
        # keep_files: false overwrites the old report so the link is always fresh
        keep_files: false