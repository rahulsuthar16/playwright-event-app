name: Playwright Tests & Publish

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      test_tag:
        description: 'Test tag to run (e.g., @smoke, @regression). Leave blank to run all tests.'
        required: false
        default: ''
        type: string

jobs:
  # --- STAGE 1: Run Tests & Upload Report ---
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Get Playwright version
      id: playwright-version
      run: echo "VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_ENV

    - name: Cache Playwright Browsers
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ env.VERSION }}

    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: |
        TAG="${{ github.event.inputs.test_tag }}"
        if [ -n "$TAG" ]; then
          echo "Running tests with tag/grep: $TAG"
          npx playwright test --grep "$TAG"
        else
          echo "No tag provided. Running all tests."
          npx playwright test
        fi
      env:
        CI: true

    - name: Upload Playwright HTML Report Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-html-report
        path: playwright-report/
        retention-days: 30

    - name: Upload Allure Results Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: allure-results/
        retention-days: 30

  # --- STAGE 2: Generate Allure Report with History & Publish ---
  publish-report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    # 1. Checkout the gh-pages branch to retrieve past history (if it exists)
    - name: Checkout gh-pages branch
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages-dir

    - name: Download Allure Results
      uses: actions/download-artifact@v4
      with:
        name: allure-results
        path: allure-results

    - name: Download Playwright HTML Report
      uses: actions/download-artifact@v4
      with:
        name: playwright-html-report
        path: playwright-report/playwright-html

    # 2. Generate Allure Report and include history from the previous run
    - name: Generate Allure Report
      uses: simple-elf/allure-report-action@master
      if: always()
      id: allure-report
      with:
        allure_results: allure-results
        gh_pages: gh-pages-dir
        allure_report: allure-report
        allure_history: allure-history
        keep_reports: 20

    - name: Merge reports for GitHub Pages
      if: always()
      run: |
        mkdir -p public
        # Copy Allure report (which now contains history) to root of public folder
        cp -r allure-report/* public/
        # Put native Playwright report in a subfolder
        mkdir -p public/playwright-html
        cp -r playwright-report/playwright-html/* public/playwright-html/

    - name: Deploy Report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        keep_files: false